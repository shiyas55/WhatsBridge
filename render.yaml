services:
  # ----------------------------------------------------
  # WhatsBridge Django REST Backend (Free Tier)
  # ----------------------------------------------------
  - type: web
    name: whatsbridge-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --workers 2 --no-access-log"
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string
      - key: BAILEYS_ENABLED
        value: "1"
      - key: BAILEYS_URL
        fromService:
          type: web
          name: whatsbridge-gateway
          property: host
      - key: BAILEYS_TOKEN
        fromService:
          type: web
          name: whatsbridge-gateway
          envVarKey: BAILEYS_TOKEN
      - key: GATEWAY_URL
        fromService:
          type: web
          name: whatsbridge-gateway
          property: host
      - key: GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_ALLOWED_HOSTS
        value: "example.com,webhook.site,httpbin.org"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,backend,whatsbridge-backend.onrender.com,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:3000,http://localhost:8080,https://whats-bridge.vercel.app,https://*.vercel.app,https://whatsbridge-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:8080,https://whats-bridge.vercel.app"

  # ----------------------------------------------------
  # WhatsApp Baileys Node.js Gateway (Free Tier)
  # ----------------------------------------------------
  - type: web
    name: whatsbridge-gateway
    env: node
    rootDir: experimental/baileys
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "node dist/server.js"
    envVars:
      - key: PORT
        value: "10000"
      - key: BAILEYS_TOKEN
        generateValue: true
      - key: BAILEYS_ENCRYPTION_KEY
        value: "y7Yv8l2QzJ3n5k7P9s1V3x5Z7a9C1e3G5i7K9m1O3q4="
      - key: BAILEYS_SESSION_DIR
        value: "/tmp/baileys_sessions"
