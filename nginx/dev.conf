map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /static/ { alias /static/; }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
    location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
    location /health { proxy_pass http://backend:8000; }
    location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host; proxy_read_timeout 300s; }
    location / { proxy_pass http://frontend:3000; proxy_set_header Host $http_host; }
}
