# Requires Docker Compose 2.24.4+ for !override. Keep internal services unexposed.
services:
  backend:
    environment: &production
      DEBUG: '0'
      TRUST_PROXY: '1'
      SECURE_SSL_REDIRECT: '1'
  worker:
    environment: *production
  beat:
    environment: *production
  migrate:
    environment: *production
  nginx:
    ports: !override ['80:80', '443:443']
    volumes: !override
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - static:/static:ro
  mailpit:
    profiles: [development]
