components:
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        prefix:
          type: string
          readOnly: true
        scopes: {}
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_used_at
      - name
      - prefix
      - project
      - revoked_at
    APIKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes: {}
        ip_allowlist: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
    CategoryEnum:
      enum:
      - utility
      - authentication
      - marketing
      type: string
      description: |-
        * `utility` - Utility
        * `authentication` - Authentication
        * `marketing` - Marketing
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        status:
          type: string
          readOnly: true
        phone_number_id:
          type: string
          maxLength: 80
        last_connected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error
      - id
      - last_connected_at
      - name
      - project
      - provider
      - status
    ConnectionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        phone_number_id:
          type: string
          maxLength: 80
      required:
      - name
      - provider
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 120
        attributes: {}
        consent:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - consent
      - created_at
      - id
      - phone
      - project
    ContactRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          maxLength: 120
        attributes: {}
      required:
      - phone
    KindEnum:
      enum:
      - text
      - template
      - image
      - document
      - video
      - audio
      type: string
      description: |-
        * `text` - text
        * `template` - template
        * `image` - image
        * `document` - document
        * `video` - video
        * `audio` - audio
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        connection:
          type: string
          format: uuid
        phone:
          type: string
          maxLength: 20
        kind:
          type: string
          maxLength: 20
        payload:
          type: object
          additionalProperties: {}
          readOnly: true
        direction:
          type: string
          maxLength: 10
        status:
          type: string
          maxLength: 20
        provider_id:
          type: string
          maxLength: 200
        scheduled_at:
          type: string
          format: date-time
        attempts:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        error:
          type: string
          maxLength: 250
        created_at:
          type: string
          format: date-time
      required:
      - connection
      - id
      - payload
      - phone
      - project
    MessageRequestRequest:
      type: object
      properties:
        connection:
          type: string
          format: uuid
        phone:
          type: string
          minLength: 1
          description: E.164 phone number with recorded messaging consent
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: text
        payload:
          description: 'Text: {"body":"Hello"}; template: {"name":"approved_name","language":"en_US","components":[]};
            media: {"link":"https://..."}'
        scheduled_at:
          type: string
          format: date-time
      required:
      - connection
      - payload
      - phone
    PaginatedAPIKeyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
